# Slot. replaces EmulationStation as the Pocket's frontend; pocket/boot.sh falls back to it.
# emustation-config and killes.sh are EmulationStation set-up; Slot needs neither.
[Service]
ExecStartPre=
ExecStart=
ExecStart=/storage/roms/slot/System/pocket-boot.sh
# The stock unit's KillMode=process would orphan Slot (a child of pocket-boot.sh) on stop.
KillMode=control-group
TimeoutStopSec=8
